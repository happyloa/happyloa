name: Update latest blog posts

on:
  schedule:
    # Runs every day at 08:15 Taiwan time (00:15 UTC)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest blog posts
        run: python scripts/update_blog_posts.py

      - name: Commit README if changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No blog post changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update latest blog posts"
          git push
